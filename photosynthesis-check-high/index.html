<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>붕어마름 실험 자기점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: 4단계 점검표 — 위 단계 띠 / 가운데 활동판 / 아래 고정 버튼 */
:root{
  --paper:#eaf7fd; --grid:#d6eef8; --card:#fffdf6; --ink:#24382a; --ink2:#55695a;
  --leaf:#2b8a50; --leaf-d:#1f6b3d; --leaf-l:#dff2e1;
  --sun:#ffc83d; --sun-l:#fff2c9; --sky:#97dcf7;
  --coral:#f0656a; --coral-l:#ffe4e2; --line:#cfe0d2;
  --display:"Jua","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid #2f7fd6;outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:3px solid var(--ink)}
.back{width:50px;height:50px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:22px;flex:none;font-family:var(--display)}
.steps{display:flex;gap:8px;flex:1;justify-content:center;flex-wrap:wrap;min-width:0}
.st{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:17px;padding:6px 12px 6px 6px;border-radius:999px;border:2.5px solid var(--line);background:#fff;color:var(--ink2)}
.st b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eef3ee;font-weight:400}
.st.now{border-color:var(--ink);color:var(--ink);background:var(--sun-l)}
.st.now b{background:var(--sun)}
.st.done{border-color:var(--leaf);color:var(--leaf-d)}
.st.done b{background:var(--leaf);color:#fff}
.main{flex:1;overflow:auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.coach{display:flex;align-items:flex-end;gap:10px}
.coach svg{width:70px;flex:none}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-family:var(--display);font-size:22px;line-height:1.35;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-14px;bottom:16px;border:7px solid transparent;border-right:9px solid var(--ink)}
.bubble small{display:block;font-family:var(--body);font-size:17px;color:var(--ink2);margin-top:4px}
.bubble.good{background:var(--leaf-l);border-color:var(--leaf-d)}
.bubble.oops{background:var(--coral-l);border-color:var(--coral)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
.kick{font-family:var(--display);font-size:17px;color:var(--leaf-d)}

/* 준비물 */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mat{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--line)}
.mat svg{width:70px;height:70px}
.mat span{font-family:var(--display);font-size:21px;line-height:1.2;text-align:center;word-break:keep-all}
.mat.on{background:var(--sun-l);border-color:#d39b00;box-shadow:0 5px 0 #f2d57a}
.mat .mk{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);background:#fff;font-family:var(--display);font-size:18px}
.mat.on .mk{background:var(--sun)}
.mat.ok{background:var(--leaf-l);border-color:var(--leaf)}
.mat.ok .mk{background:var(--leaf);color:#fff}
.mat.bad{background:var(--coral-l);border-color:var(--coral)}
.mat.bad .mk{background:var(--coral);color:#fff}
.mat.miss{border-style:dashed;border-color:#e2862b;background:#fff4e6}
.mat.miss .mk{background:#e2862b;color:#fff}
.mat .why{font-size:14px;font-family:var(--body);color:var(--ink2)}
.mat:disabled{cursor:default}

/* 순서 */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.slot{border:3px dashed #b9c6ad;border-radius:18px;min-height:64px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;font-family:var(--display);font-size:19px;line-height:1.3;word-break:keep-all}
.slot .n{width:34px;height:34px;flex:none;border-radius:50%;background:#eef3ee;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:19px}
.slot.fill{border-style:solid;border-color:var(--ink)}
.slot.fill .n{background:var(--sun)}
.slot.ok{border-color:var(--leaf);background:var(--leaf-l)}
.slot.ok .n{background:var(--leaf);color:#fff}
.slot.bad{border-color:var(--coral);background:var(--coral-l)}
.slot.bad .n{background:var(--coral);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 5px 0 var(--line);position:relative}
.card svg{width:100%;height:auto;max-width:300px}
.card p{margin:0;font-family:var(--display);font-size:20px;line-height:1.35;text-align:center;word-break:keep-all}
.card .badge{position:absolute;top:-12px;left:-12px;width:44px;height:44px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px}
.card.used{opacity:.45;box-shadow:none}

/* 퀴즈 */
.qbox{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.qnum{font-family:var(--display);font-size:18px;color:var(--ink2)}
.q{font-size:clamp(23px,2.8vw,30px);font-weight:800;line-height:1.45;margin:0;word-break:keep-all}
.qopts{display:flex;flex-wrap:wrap;gap:12px}
.qo{flex:1 1 180px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 12px;font-family:var(--display);font-size:26px;box-shadow:0 6px 0 var(--ink)}
.qo:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.qo.nope{opacity:.3;pointer-events:none;box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.qo.right{background:var(--leaf-l);border-color:var(--leaf);box-shadow:0 6px 0 var(--leaf-d)}
.qo.shake{animation:shake .4s}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:#dfe7dc;border:2px solid var(--ink)}
.dot.on{background:var(--sun)}
.dot.ok{background:var(--leaf)}

/* 나의 점검 */
.selfs{display:flex;flex-direction:column;gap:12px}
.self{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.self p{margin:0;flex:1 1 300px;font-size:22px;line-height:1.45;word-break:keep-all}
.faces{display:flex;gap:8px}
.face{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 10px;font-family:var(--display);font-size:16px;min-width:88px}
.face svg{width:44px;height:44px}
.face.on{border-color:var(--ink);background:var(--sun-l);box-shadow:0 0 0 4px #ffe59a}

/* 결과 */
.result{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:20px clamp(16px,3vw,30px);box-shadow:8px 8px 0 var(--line);display:flex;flex-direction:column;gap:16px}
.rhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rhead svg{width:72px}
.rhead h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.1}
.rhead .who{color:var(--ink2);font-size:19px}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.score{border:3px solid var(--line);border-radius:20px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:4px}
.score .t{font-family:var(--display);font-size:20px}
.score .v{font-family:var(--display);font-size:40px;color:var(--leaf-d);font-variant-numeric:tabular-nums}
.score .v small{font-size:22px;color:var(--ink2)}
.score .s{font-size:16px;color:var(--ink2)}
.stars{display:flex;gap:2px}
.stars svg{width:26px;height:26px}
.rself{border:3px solid var(--line);border-radius:20px;padding:12px 16px;background:#fff}
.rself h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px}
.rself li{font-size:19px;line-height:1.7}
.rself ul{margin:0;padding-left:1.1em}
.tip{background:var(--sun-l);border:3px solid var(--sun);border-radius:20px;padding:12px 16px;font-size:19px;line-height:1.6}

/* 시작 */
.start{max-width:860px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
.start .hero svg{width:min(220px,38vw)}
.start h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,5.6vw,58px);margin:4px 0 8px;line-height:1.08;text-wrap:balance}
.start h1 em{font-style:normal;color:var(--leaf)}
.start p{font-size:20px;line-height:1.6;margin:0 0 14px;color:var(--ink2)}
.plan{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.plan li{display:flex;gap:10px;align-items:center;font-size:19px}
.plan li b{width:32px;height:32px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:400;flex:none}
.namebox{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.namebox label{font-family:var(--display);font-size:21px}
.namebox input{font:inherit;font-size:24px;padding:10px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:100%;max-width:320px}
.ghost{font-family:var(--display);font-size:18px;background:transparent;border:3px dashed #b9c6ad;border-radius:14px;padding:8px 14px;color:var(--ink2)}
.ghost.warn{border:3px solid var(--coral);color:var(--coral)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.dock{background:var(--card);border-top:3px solid var(--ink);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:1100px;margin:0 auto;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.dock-note{font-family:var(--display);font-size:18px;color:var(--ink2)}
.btn{font-family:var(--display);font-size:28px;background:var(--leaf);color:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 34px;box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{background:#b9c6ad;cursor:not-allowed;box-shadow:0 7px 0 #8a9a86}
.btn.alt{background:#fff;color:var(--ink)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:760px){
  .slots{grid-template-columns:minmax(0,1fr)}
  .scores{grid-template-columns:minmax(0,1fr)}
  .start{grid-template-columns:minmax(0,1fr)}
  .start .hero{display:flex;justify-content:center}
  .st{font-size:0;padding:4px}
  .st b{font-size:16px}
  .mats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
const INK='#24382a';
const SW=`stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const T=(x,y,s,t)=>`<text x="${x}" y="${y}" font-family="Jua, sans-serif" font-size="${s}" text-anchor="middle" fill="${INK}">${t}</text>`;

function mascot(mood){
  const mouth = mood==='oops' ? `<path d="M53 89 Q60 84 67 89" fill="none" ${SW}/>` : `<path d="M51 85 Q60 98 69 85Z" fill="#e8604c" ${SW}/>`;
  return `<svg viewBox="0 0 120 150" aria-hidden="true"><path d="M60 32 C60 22 61 16 62 9" stroke="#2a7a42" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M62 13 C70 0 88 2 92 9 C83 18 70 20 62 13Z" fill="#6cc46f" ${SW}/><path d="M61 15 C52 3 35 5 31 12 C40 21 54 21 61 15Z" fill="#9adb7c" ${SW}/><path d="M26 150 C26 120 40 106 60 106 C80 106 94 120 94 150Z" fill="#fff" ${SW}/><path d="M51 106 L60 122 L69 106Z" fill="#3c9d58" ${SW}/><circle cx="60" cy="68" r="38" fill="#ffd9b6" ${SW}/><path d="M22 64 C20 38 40 28 60 28 C82 28 100 40 98 64 C90 52 76 47 62 48 C48 47 33 53 22 64Z" fill="#5a3b2a" ${SW}/><path d="M24 58 C40 50 80 50 96 58" stroke="#3c9d58" stroke-width="7" fill="none"/><circle cx="45" cy="54" r="11" fill="#bfe6ff" ${SW}/><circle cx="75" cy="54" r="11" fill="#bfe6ff" ${SW}/><ellipse cx="47" cy="76" rx="4.5" ry="6" fill="${INK}"/><ellipse cx="73" cy="76" rx="4.5" ry="6" fill="${INK}"/><ellipse cx="36" cy="86" rx="6" ry="4" fill="#ff9e8a" opacity=".75"/><ellipse cx="84" cy="86" rx="6" ry="4" fill="#ff9e8a" opacity=".75"/>${mouth}</svg>`;
}

/* ---------- 준비물 그림 (64×64) ---------- */
const MI = {
  'BTB용액':`<rect x="25" y="5" width="14" height="9" rx="2" fill="${INK}"/><path d="M20 15 h24 v40 a5 5 0 0 1 -5 5 h-14 a5 5 0 0 1 -5 -5Z" fill="#3a86dc" ${SW}/><rect x="23" y="27" width="18" height="17" rx="3" fill="#fff" stroke="${INK}" stroke-width="2"/>${T(32,40,9,'BTB')}`,
  '스포이드':`<rect x="25" y="4" width="14" height="20" rx="7" fill="#ff7b54" ${SW}/><path d="M28 23 H36 L34 54 H30Z" fill="#eef6fb" ${SW}/><path d="M30 42 H34 L34 54 H30Z" fill="#3a86dc"/><path d="M32 57 c-3 4 -4 6 -4 7 a4 4 0 0 0 8 0 c0 -1 -1 -3 -4 -7Z" fill="#3a86dc"/>`,
  '비커':`<path d="M14 14 V50 a6 6 0 0 0 6 6 H44 a6 6 0 0 0 6 -6 V14" fill="#fff" ${SW}/><path d="M17 34 V50 a3 3 0 0 0 3 3 H44 a3 3 0 0 0 3 -3 V34Z" fill="#bfe6ff"/><path d="M14 14 V50 a6 6 0 0 0 6 6 H44 a6 6 0 0 0 6 -6 V14" fill="none" ${SW}/><path d="M9 14 H55" ${SW}/><path d="M42 22 h6 M42 30 h6 M42 38 h6" stroke="${INK}" stroke-width="2"/>`,
  '빨대':`<path d="M16 58 L30 22 L38 8 L50 4" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 58 L30 22 L38 8 L50 4" fill="none" stroke="#ff7b54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 40 l5 2 M27 32 l5 2" stroke="#fff" stroke-width="2"/>`,
  '장갑':`<path d="M18 58 V30 a4 4 0 0 1 8 0 V16 a4 4 0 0 1 8 0 V14 a4 4 0 0 1 8 0 V18 a4 4 0 0 1 8 0 V40 C50 52 44 58 34 58Z" fill="#9bd0f5" ${SW}/><path d="M18 40 C12 36 8 30 10 26 C14 24 18 28 18 32" fill="#9bd0f5" ${SW}/><path d="M18 52 H48" stroke="#5aa9dd" stroke-width="3"/>`,
  '시험관 3개':`<g>${[14,32,50].map(x=>`<path d="M${x-6} 8 V48 a6 6 0 0 0 12 0 V8" fill="#fff" ${SW}/><path d="M${x-4} 30 V48 a4 4 0 0 0 8 0 V30Z" fill="#bfe6ff"/><path d="M${x-6} 8 V48 a6 6 0 0 0 12 0 V8" fill="none" ${SW}/>`).join('')}</g>`,
  '시험관대':`<rect x="4" y="24" width="56" height="12" rx="3" fill="#e2b27a" ${SW}/><rect x="4" y="46" width="56" height="8" rx="3" fill="#e2b27a" ${SW}/><path d="M8 36 V54 M56 36 V54" ${SW}/><ellipse cx="18" cy="29" rx="5" ry="2.5" fill="#8a5a2b"/><ellipse cx="32" cy="29" rx="5" ry="2.5" fill="#8a5a2b"/><ellipse cx="46" cy="29" rx="5" ry="2.5" fill="#8a5a2b"/>`,
  '붕어마름':`<path d="M32 60 C26 44 38 30 32 6" stroke="#2c6f35" stroke-width="3" fill="none"/>`+[54,46,38,30,22,14].map((y,i)=>`<ellipse cx="${i%2?40:24}" cy="${y}" rx="9" ry="3.2" fill="${i%2?'#3f9a45':'#5bb85a'}" stroke="${INK}" stroke-width="1.5" transform="rotate(${i%2?25:-25} ${i%2?40:24} ${y})"/>`).join(''),
  '알루미늄 호일':`<polygon points="8,16 22,8 36,14 52,8 58,22 54,40 58,54 40,58 26,54 10,58 6,40 10,28" fill="#d5dbe1" ${SW}/><path d="M14 22 l8 6 l8 -5 l10 6 l10 -4 M14 42 l10 -4 l10 5 l12 -4" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  '실험복':`<path d="M20 8 L32 14 L44 8 L56 18 L50 30 L46 28 V58 H18 V28 L14 30 L8 18Z" fill="#fff" ${SW}/><path d="M32 14 V58 M26 10 L32 26 L38 10" fill="none" ${SW}/><rect x="36" y="38" width="8" height="7" rx="1.5" fill="#bfe6ff" stroke="${INK}" stroke-width="2"/>`,
  '가위':`<circle cx="18" cy="48" r="8" fill="#ff7b54" ${SW}/><circle cx="46" cy="48" r="8" fill="#ff7b54" ${SW}/><path d="M23 42 L46 6 M41 42 L18 6" ${SW}/>`,
  '돋보기':`<circle cx="26" cy="26" r="16" fill="#e6f5ff" ${SW}/><path d="M38 38 L56 56" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path d="M18 20 a10 10 0 0 1 8 -6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  '탈지면':`<path d="M10 44 a10 10 0 0 1 6 -18 a12 12 0 0 1 20 -8 a11 11 0 0 1 16 10 a9 9 0 0 1 2 16Z" fill="#fff" ${SW}/><path d="M22 34 q4 -4 8 0 M34 30 q4 -4 8 0" stroke="#c9d3db" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
  '유성펜':`<path d="M14 54 L44 12 L54 20 L24 60Z" fill="#3a4fa8" ${SW}/><path d="M14 54 L8 62 L24 60" fill="#24382a" ${SW}/><path d="M38 20 L48 28" stroke="#fff" stroke-width="2.5"/>`
};
const NEED=['BTB용액','스포이드','비커','빨대','장갑','시험관 3개','시험관대','붕어마름','알루미늄 호일','실험복'];
const EXTRA={'가위':'뿌리 실험 준비물이에요','돋보기':'줄기 실험 준비물이에요','탈지면':'뿌리 실험 준비물이에요','유성펜':'뿌리 실험 준비물이에요'};
const ALLMATS=[...NEED,...Object.keys(EXTRA)];

/* ---------- 실험 과정 그림 (안내판과 같은 그림) ---------- */
const tubeP=(x,col,top=22,bot=88,r=11)=>`<path d="M${x-r} ${top} V${bot} a${r} ${r} 0 0 0 ${2*r} 0 V${top}" fill="#fff"/><path d="M${x-r+2} ${top+28} V${bot} a${r-2} ${r-2} 0 0 0 ${2*r-4} 0 V${top+28}Z" fill="${col}"/>`;
const tubeO=(x,top=22,bot=88,r=11)=>`<path d="M${x-r} ${top} V${bot} a${r} ${r} 0 0 0 ${2*r} 0 V${top}" fill="none" ${SW}/><rect x="${x-r-4}" y="${top-6}" width="${2*r+8}" height="7" rx="3.5" fill="#f4f9fc" stroke="${INK}" stroke-width="2.5"/>`;

const STEPS=[
  {s:'물과 BTB 담기',t:'비커에 물 60ml와 BTB용액 3ml를 담는다.', art:bg+`<path d="M14 104 H246" stroke="${INK}" stroke-width="2"/><g transform="translate(26 30) scale(1.15)">${MI['BTB용액']}</g>`+`<path d="M80 40 C98 20 114 22 124 36" fill="none" stroke="#5c705f" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>`+beaker(132,'#3a86dc')+T(174,30,15,'60ml + 3ml')},
  {s:'숨 불어 넣기',t:'빨대로 숨을 불어 넣어 노란색으로 만든다.', art:bg+`<path d="M26 104 C26 90 40 84 56 84 C72 84 86 90 86 104Z" fill="#3c9d58" ${SW}/><circle cx="56" cy="54" r="30" fill="#ffd9b6" ${SW}/><path d="M26 50 C24 28 42 20 58 22 C74 22 88 32 86 48 C76 40 64 38 54 40 C42 40 32 44 26 50Z" fill="#5a3b2a" ${SW}/><ellipse cx="64" cy="54" rx="3.5" ry="4.5" fill="${INK}"/><circle cx="74" cy="68" r="9" fill="#ffb3a3" stroke="${INK}" stroke-width="2"/>`+beaker(136,'#f6cc3b')+`<path d="M86 68 L112 68 L124 30 L160 30 L160 96" fill="none" stroke="#ff7b54" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="172" cy="88" r="4" fill="#fff" stroke="${INK}" stroke-width="1.5"/><circle cx="180" cy="76" r="3" fill="#fff" stroke="${INK}" stroke-width="1.5"/>`+T(104,98,16,'후~')},
  {s:'A·B·C에 나누기',t:'노란색 BTB용액을 시험관 A, B, C에 똑같이 나누어 담는다.', art:bg+`<g transform="rotate(-38 46 66)"><path d="M24 44 V82 a8 8 0 0 0 8 8 H60 a8 8 0 0 0 8 -8 V44" fill="#fff"/><path d="M27 56 V82 a5 5 0 0 0 5 5 H60 a5 5 0 0 0 5 -5 V56Z" fill="#f6cc3b"/><path d="M24 44 V82 a8 8 0 0 0 8 8 H60 a8 8 0 0 0 8 -8 V44" fill="none" ${SW}/></g><path d="M80 30 C92 30 100 34 106 44" fill="none" stroke="#f6cc3b" stroke-width="5" stroke-linecap="round"/>`+[110,160,210].map(x=>tubeP(x,'#f6cc3b')+tubeO(x)).join('')+`<rect x="88" y="62" width="144" height="13" rx="4" fill="#e2b27a" stroke="${INK}" stroke-width="2.5"/>`+T(110,117,14,'A')+T(160,117,14,'B')+T(210,117,14,'C')},

  {s:'햇빛에 2시간',t:'햇빛이 잘 드는 곳에 2시간 두고 색깔 변화를 관찰한다.', art:bg+`<rect x="10" y="10" width="92" height="84" rx="6" fill="#cfeaff" ${SW}/><path d="M56 10 V94 M10 52 H102" ${SW}/><circle cx="33" cy="32" r="10" fill="#ffd23f" stroke="${INK}" stroke-width="2.5"/><path d="M104 34 L136 50 M104 56 L136 66" stroke="#ffaa00" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><rect x="0" y="98" width="260" height="10" fill="#e2b27a" stroke="${INK}" stroke-width="2"/>`+tubeP(149,'#f6cc3b',18,80,10)+tubeO(149,18,80,10)+tubeP(189,'#3a86dc',18,80,10)+weed(189,40,88)+tubeO(189,18,80,10)+tubeP(229,'#f6cc3b',18,80,10)+tubeO(229,18,80,10)+`<polygon points="214,12 226,8 238,12 244,10 244,52 232,58 220,54 213,58" fill="#d5dbe1" ${SW}/>`+`<circle cx="228" cy="26" r="0"/>`+T(149,120,13,'A')+T(189,120,13,'B')+T(229,120,13,'C')+`<g transform="translate(206 70)"><circle cx="0" cy="0" r="0"/></g>`}
];
const stepSvg=i=>`<svg viewBox="0 0 260 124" role="img" aria-label="${STEPS[i].t}">${STEPS[i].art}</svg>`;

/* ---------- 핵심 퀴즈 ---------- */
const QUIZ=[
  {q:'비커에 물을 몇 ml 넣나요?', o:['6ml','60ml','600ml'], a:'60ml'},
  {q:'BTB용액은 몇 ml 넣나요?', o:['3ml','30ml','300ml'], a:'3ml'},
  {q:'빨대로 숨을 어떻게 하나요?', o:['불어 넣어요','빨아들여요'], a:'불어 넣어요', h:'안내판의 ※ 표시를 떠올려요'},
  {q:'숨을 불어 넣으면 BTB용액은 무슨 색이 되나요?', o:['파란색','노란색','빨간색'], a:'노란색'},
  {q:'붕어마름을 넣는 시험관은 어느 것인가요?', o:['A와 B','B와 C','A만'], a:'B와 C'},
  {q:'알루미늄 호일로 감싸는 시험관은 어느 것인가요?', o:['A','B','C'], a:'C'},
  {q:'햇빛이 잘 드는 곳에 얼마 동안 두나요?', o:['2분','2시간','2일'], a:'2시간'}
];
const SELF=['실험 준비물을 스스로 챙길 수 있어요.','실험 순서를 친구에게 말할 수 있어요.','장갑을 끼고, 빨대로 빨아들이지 않고 안전하게 실험할 수 있어요.'];
const FACES=[['잘해요','#ffd23f'],['보통이에요','#ffe59a'],['더 연습할래요','#cfe6ff']];
const face=k=>`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="${FACES[k][1]}" ${SW}/><circle cx="17" cy="20" r="2.6" fill="${INK}"/><circle cx="31" cy="20" r="2.6" fill="${INK}"/>${k===0?`<path d="M14 28 Q24 40 34 28" fill="none" ${SW}/>`:k===1?`<path d="M16 31 H32" ${SW}/>`:`<path d="M16 33 Q24 27 32 33" fill="none" ${SW}/>`}</svg>`;
const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.3 L16.6 14 L18.2 21 L12 17.3 L5.8 21 L7.4 14 L2 9.3 L9.1 8.6Z" fill="${on?'#ffc83d':'#e3e8e1'}" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

/* ---------- 상태 ---------- */
const KEY='bungeo-selfcheck-high-v1';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fresh=()=>({name:'',page:0,matOrder:shuffle(ALLMATS),sel:[],matChecked:false,matFirst:null,
  cardOrder:shuffle([0,1,2,3,4]),seq:[],ordChecked:false,ordFirst:null,
  qi:0,qMiss:0,qFirst:0,qOrder:QUIZ.map(q=>shuffle(q.o)),self:[null,null,null]});
let st=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.matOrder) st=Object.assign(fresh(),s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
let msg=null, nope=new Set(), resetArm=false;
const app=document.getElementById('app');
const PAGES=['준비물','실험 순서','핵심 확인','나의 점검'];

function go(p){ st.page=p; msg=null; nope=new Set(); save(); render(); const m=document.querySelector('.main'); if(m) m.scrollTop=0; }
function top(){
  return `<header class="top"><button class="back" id="back" aria-label="이전">◀</button><div class="steps">${PAGES.map((n,i)=>{
    const k=i+1, cls = st.page===k?'now': st.page>k?'done':'';
    return `<span class="st ${cls}"><b>${st.page>k?'✓':k}</b>${n}</span>`;}).join('')}</div></header>`;
}
function coach(def){
  const m=msg||def; return `<div class="coach">${mascot(m.type==='oops'?'oops':'')}<div class="bubble ${m.type||''}">${m.text}${m.sub?`<small>${m.sub}</small>`:''}</div></div>`;
}
function shell(body,dock){
  app.innerHTML=top()+`<main class="main"><div class="wrap">${body}</div></main><footer class="dock"><div class="dock-in">${dock}</div></footer>`;
  document.getElementById('back').onclick=()=>go(st.page-1);
}
function render(){
  if(st.page===0) return renderStart();
  if(st.page===1) return renderMats();
  if(st.page===2) return renderOrder();
  if(st.page===3) return renderQuiz();
  if(st.page===4) return renderSelf();
  return renderResult();
}

/* ---------- 시작 ---------- */
function renderStart(){
  const started=st.page>0||st.sel.length||st.seq.length||st.qi>0;
  app.innerHTML=`<main class="main"><div class="start">
    <div class="hero">${mascot()}</div>
    <div>
      <div class="kick">실험 1) 식물의 광합성 실험 · BTB용액과 붕어마름의 만남</div>
      <h1>실험 전 <em>자기점검</em></h1>
      <p>실험을 시작하기 전에 내가 잘 알고 있는지 스스로 확인해요.</p>
      <ul class="plan"><li><b>1</b>준비물 고르기</li><li><b>2</b>실험 순서 맞추기</li><li><b>3</b>핵심 확인 문제</li><li><b>4</b>나의 점검</li></ul>
      <div class="namebox"><label for="nm">내 이름</label><input id="nm" maxlength="12" autocomplete="off" placeholder="이름을 써요" value="${esc(st.name)}"></div>
      <div class="row"><button class="btn" id="go">시작하기 ▶</button>
      ${started?`<button class="ghost ${resetArm?'warn':''}" id="reset">${resetArm?'한 번 더 누르면 지워져요':'처음부터 다시'}</button>`:''}</div>
    </div></div></main>`;
  const nm=document.getElementById('nm'); nm.oninput=()=>{st.name=nm.value.trim();save();};
  document.getElementById('go').onclick=()=>{st.name=nm.value.trim();go(1);};
  const r=document.getElementById('reset');
  if(r) r.onclick=()=>{ if(!resetArm){resetArm=true;renderStart();setTimeout(()=>{resetArm=false;if(st.page===0)renderStart();},3000);return;} resetArm=false; st=fresh(); save(); renderStart(); };
}
const esc=t=>String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ---------- 1. 준비물 ---------- */
function renderMats(){
  const chk=st.matChecked;
  const cards=st.matOrder.map(m=>{
    const on=st.sel.includes(m), need=NEED.includes(m);
    let cls=on?'on':'', mk=on?'✓':'', why='';
    if(chk){ if(on&&need){cls='ok';mk='✓';} else if(on&&!need){cls='bad';mk='✕';why=EXTRA[m];} else if(!on&&need){cls='miss';mk='!';why='빠졌어요';} else {cls='';mk='';} }
    return `<button class="mat ${cls}" data-m="${m}" id="m-${m.replace(/\s/g,'')}" ${chk?'disabled':''} aria-pressed="${on}"><span class="mk" aria-hidden="true">${mk}</span><svg viewBox="0 0 64 64" aria-hidden="true">${MI[m]}</svg><span>${m}</span>${why?`<span class="why">${why}</span>`:''}</button>`;
  }).join('');
  const right=st.sel.filter(m=>NEED.includes(m)).length, wrong=st.sel.length-right;
  const perfect=chk&&right===NEED.length&&wrong===0;
  const def = !chk ? {text:'이 실험에 필요한 준비물을 모두 골라요!',sub:`필요 없는 것도 섞여 있어요. 고른 개수: ${st.sel.length}개`}
    : perfect ? {type:'good',text:'완벽해요! 준비물을 모두 맞게 골랐어요.'} : {type:'oops',text:`필요한 준비물 ${NEED.length}개 중 ${right}개를 골랐어요.`,sub:`${wrong?`필요 없는 것 ${wrong}개(빨간색), `:''}빠진 것은 주황색 점선으로 보여요.`};
  shell(coach(def)+`<div><div class="kick">1단계</div><h2>준비물 고르기</h2></div><div class="mats">${cards}</div>`,
    !chk ? `<button class="btn" id="chk" ${st.sel.length?'':'disabled'}>확인하기</button>`
         : `${perfect?'':`<button class="btn alt" id="retry">다시 고르기</button>`}<button class="btn" id="next">다음 단계 ▶</button>`);
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const m=b.dataset.m; st.sel=st.sel.includes(m)?st.sel.filter(x=>x!==m):[...st.sel,m]; save(); renderMats(); });
  const c=document.getElementById('chk'); if(c) c.onclick=()=>{ st.matChecked=true; if(st.matFirst===null) st.matFirst=Math.max(0,right-wrong); save(); renderMats(); };
  const r=document.getElementById('retry'); if(r) r.onclick=()=>{ st.matChecked=false; st.sel=st.sel.filter(m=>NEED.includes(m)); save(); renderMats(); };
  const n=document.getElementById('next'); if(n) n.onclick=()=>go(2);
}

/* ---------- 2. 순서 ---------- */
function renderOrder(){
  const chk=st.ordChecked;
  const slots=[0,1,2,3,4].map(k=>{
    const s=st.seq[k]; let cls=s===undefined?'':'fill';
    if(chk&&s!==undefined) cls= s===k?'ok':'bad';
    return `<div class="slot ${cls}"><span class="n">${k+1}</span><span>${s===undefined?'':STEPS[s].s}</span></div>`;
  }).join('');
  const cards=st.cardOrder.map(i=>{
    const pos=st.seq.indexOf(i);
    return `<button class="card ${pos>=0&&!chk?'':''}" data-c="${i}" id="c-${i}" ${chk?'disabled':''} aria-label="${STEPS[i].t}">${pos>=0?`<span class="badge">${pos+1}</span>`:''}${stepSvg(i)}<p>${STEPS[i].t}</p></button>`;
  }).join('');
  const nOk=st.seq.filter((s,k)=>s===k).length, full=st.seq.length===5, perfect=chk&&nOk===5;
  const def = !chk ? {text:'실험 순서대로 카드를 눌러요!',sub:'처음 할 일부터 차례로 누르면 번호가 붙어요. 번호를 지우려면 그 카드를 다시 눌러요.'}
    : perfect ? {type:'good',text:'순서를 모두 맞혔어요!'} : {type:'oops',text:`5개 중 ${nOk}개가 맞는 자리에 있어요.`,sub:'빨간 칸이 틀린 자리예요. 다시 맞춰 볼까요?'};
  shell(coach(def)+`<div><div class="kick">2단계</div><h2>실험 순서 맞추기</h2></div><div class="slots">${slots}</div><div class="cards">${cards}</div>`,
    !chk ? `<span class="dock-note">${st.seq.length} / 5</span><button class="btn" id="chk" ${full?'':'disabled'}>확인하기</button>`
         : `${perfect?'':`<button class="btn alt" id="retry">틀린 것 다시 하기</button>`}<button class="btn" id="next">다음 단계 ▶</button>`);
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.c, pos=st.seq.indexOf(i); if(pos>=0) st.seq=st.seq.slice(0,pos); else if(st.seq.length<5) st.seq=[...st.seq,i]; save(); renderOrder(); });
  const c=document.getElementById('chk'); if(c) c.onclick=()=>{ st.ordChecked=true; if(st.ordFirst===null) st.ordFirst=nOk; save(); renderOrder(); };
  const r=document.getElementById('retry'); if(r) r.onclick=()=>{ let k=0; while(k<5&&st.seq[k]===k) k++; st.seq=st.seq.slice(0,k); st.ordChecked=false; save(); renderOrder(); };
  const n=document.getElementById('next'); if(n) n.onclick=()=>go(3);
}

/* ---------- 3. 핵심 확인 ---------- */
function renderQuiz(){
  if(st.qi>=QUIZ.length){
    shell(coach({type:'good',text:`핵심 확인 끝! 한 번에 맞힌 문제: ${st.qFirst} / ${QUIZ.length}`})+`<div><div class="kick">3단계</div><h2>핵심 확인 문제</h2></div>`,
      `<button class="btn alt" id="again">다시 풀기</button><button class="btn" id="next">다음 단계 ▶</button>`);
    document.getElementById('next').onclick=()=>go(4);
    document.getElementById('again').onclick=()=>{ st.qi=0; st.qMiss=0; save(); renderQuiz(); };
    return;
  }
  const Q=QUIZ[st.qi], opts=st.qOrder[st.qi];
  const dots=QUIZ.map((_,k)=>`<span class="dot ${k<st.qi?'ok':k===st.qi?'on':''}"></span>`).join('');
  shell(coach({text:'안내판에서 본 내용을 떠올려 골라요!'})+`<div><div class="kick">3단계</div><h2>핵심 확인 문제</h2></div>
    <div class="qbox"><div class="row" style="justify-content:space-between"><span class="qnum">${st.qi+1} / ${QUIZ.length}</span><span class="dots">${dots}</span></div>
    <p class="q">${Q.q}</p><div class="qopts">${opts.map((o,k)=>`<button class="qo ${nope.has(o)?'nope':''} ${st.qMiss>=2&&o===Q.a?'right':''}" data-o="${k}" id="q-${st.qi}-${k}">${o}</button>`).join('')}</div></div>`,
    `<span class="dock-note">답을 누르면 바로 확인돼요</span>`);
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.o];
    if(o===Q.a){ if(st.qMiss===0) st.qFirst++; st.qi++; st.qMiss=0; nope=new Set(); msg={type:'good',text:'정답이에요!'}; save(); renderQuiz(); setTimeout(()=>{msg=null;},10); }
    else { st.qMiss++; nope.add(o); msg={type:'oops',text:'다시 골라 볼까요?',sub:Q.h||'안내판을 다시 떠올려요'}; b.classList.add('shake'); save(); setTimeout(renderQuiz,380); }
  });
}

/* ---------- 4. 나의 점검 ---------- */
function renderSelf(){
  const all=st.self.every(v=>v!==null);
  shell(coach({text:'나는 얼마나 할 수 있나요? 솔직하게 골라요.'})+`<div><div class="kick">4단계</div><h2>나의 점검</h2></div>
    <div class="selfs">${SELF.map((s,i)=>`<div class="self"><p>${s}</p><div class="faces">${FACES.map((f,k)=>`<button class="face ${st.self[i]===k?'on':''}" data-s="${i}" data-k="${k}" id="s-${i}-${k}" aria-pressed="${st.self[i]===k}">${face(k)}${f[0]}</button>`).join('')}</div></div>`).join('')}</div>`,
    `<button class="btn" id="next" ${all?'':'disabled'}>점검 결과 보기 ★</button>`);
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ st.self[+b.dataset.s]=+b.dataset.k; save(); renderSelf(); });
  document.getElementById('next').onclick=()=>{ if(st.self.every(v=>v!==null)) go(5); };
}

/* ---------- 결과 ---------- */
function renderResult(){
  const m=st.matFirst??0, o=st.ordFirst??0, q=st.qFirst;
  const stars=(v,max)=>{const n=Math.round(v/max*3); return `<span class="stars">${[0,1,2].map(i=>star(i<n)).join('')}</span>`;};
  const weak=[]; if(m<NEED.length) weak.push('준비물 목록을 안내판에서 한 번 더 읽어 봐요.'); if(o<5) weak.push('실험 순서를 소리 내어 차례로 말해 봐요.'); if(q<QUIZ.length) weak.push('물 60ml, BTB용액 3ml, 2시간을 기억해요.');
  const d=new Date();
  app.innerHTML=top()+`<main class="main"><div class="wrap"><div class="result">
    <div class="rhead">${mascot()}<div><h1>나의 자기점검 결과</h1><div class="who">${esc(st.name)||'꼬마 과학자'} · ${d.getMonth()+1}월 ${d.getDate()}일 · BTB용액과 붕어마름의 만남</div></div></div>
    <div class="scores">
      <div class="score"><span class="t">준비물</span><span class="v">${m}<small> / ${NEED.length}</small></span>${stars(m,NEED.length)}<span class="s">처음 확인했을 때 점수</span></div>
      <div class="score"><span class="t">실험 순서</span><span class="v">${o}<small> / 5</small></span>${stars(o,5)}<span class="s">처음 확인했을 때 맞은 자리</span></div>
      <div class="score"><span class="t">핵심 확인</span><span class="v">${q}<small> / ${QUIZ.length}</small></span>${stars(q,QUIZ.length)}<span class="s">한 번에 맞힌 문제</span></div>
    </div>
    <div class="rself"><h3>나의 점검</h3><ul>${SELF.map((s,i)=>`<li>${s} → <b>${FACES[st.self[i]][0]}</b></li>`).join('')}</ul></div>
    <div class="tip"><b style="font-family:var(--display);font-weight:400;font-size:21px">실험 전에 기억해요</b><br>${weak.length?weak.join('<br>'):'모든 점검을 완벽하게 해냈어요! 이제 실험을 시작해요.'}<br>장갑을 끼고, 빨대로는 꼭 불어 넣기만 해요.</div>
  </div></div></main><footer class="dock"><div class="dock-in"><button class="btn alt" id="home">처음 화면</button></div></footer>`;
  document.getElementById('back').onclick=()=>go(4);
  document.getElementById('home').onclick=()=>go(0);
}

render();
})();
</script>
</body></html>
