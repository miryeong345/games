<title>길찾기 미션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a toy-town board game. Sky page, grass board, chunky sticker buttons. One deliberate bright world (single theme). */
:root{
  color-scheme: light;
  --sky:#DDF1FF; --sky2:#C3E6FF;
  --ink:#24324A; --ink2:#5A6782;
  --paper:#FFFFFF; --cream:#FFF7EC;
  --coral:#FF6960; --coral-d:#E2463D; --coral-t:#FFE3DF;
  --sun:#FFC83D; --sun-d:#E0A400;
  --grass:#A8DB7E; --grass2:#93CF66; --grass-edge:#7DBB52;
  --road:#D8D4CC; --road-edge:#C2BDB3;
  --ok:#2EA36B; --ok-t:#DDF5E8;
  --line:#E3E9F2;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;
  background-image:radial-gradient(circle at 12% 8%,#fff 0 38px,transparent 39px),radial-gradient(circle at 18% 9%,#fff 0 28px,transparent 29px),
  radial-gradient(circle at 86% 14%,#fff 0 30px,transparent 31px),radial-gradient(circle at 91% 13%,#fff 0 22px,transparent 23px);
  background-repeat:no-repeat;}
.app{max-width:780px;margin:0 auto;padding-block:14px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
svg{width:1em;height:1em;display:block}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.round{width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px;
  box-shadow:0 4px 0 var(--sky2);flex:none}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky2)}
.bar .ttl{flex:1;min-width:0;font-family:var(--display);font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:6px;justify-content:center;margin:-2px 0 12px;flex-wrap:wrap}
.steps span{font-family:var(--display);font-size:13px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.6);color:var(--ink2)}
.steps span.on{background:var(--coral);color:#fff}
.steps span.done{background:var(--ok-t);color:var(--ok)}

/* ---------- home ---------- */
.hero{text-align:center;padding:18px 0 6px}
.hero .kicker{display:inline-flex;gap:8px;align-items:center;font-family:var(--display);background:var(--paper);padding:6px 14px;border-radius:99px;font-size:15px;color:var(--coral);box-shadow:0 3px 0 var(--sky2)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,12vw,78px);line-height:1.05;margin:14px 0 4px;color:var(--coral);
  text-shadow:0 4px 0 #fff,0 8px 0 rgba(36,50,74,.12);letter-spacing:.02em;text-wrap:balance}
.hero p{margin:6px auto 0;max-width:30em;color:var(--ink2);font-size:17px}
.trail{position:relative;margin:22px auto 0;display:grid;gap:14px}
.lv{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border-radius:24px;padding:14px 16px;
  box-shadow:0 6px 0 var(--sky2);transition:transform .12s}
.lv:hover{transform:translateY(-2px)}
.lv:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky2)}
.lv .num{width:64px;height:64px;flex:none;border-radius:20px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff}
.lv .meta{flex:1;min-width:0}
.lv .name{font-family:var(--display);font-size:24px}
.lv .desc{color:var(--ink2);font-size:15px;margin-top:2px}
.lv .stars{display:flex;gap:2px;font-size:22px;color:#E6E1D6}
.lv .stars .got{color:var(--sun)}
.lv .go{font-size:20px;color:var(--ink2)}
.diff{display:inline-flex;gap:3px;margin-left:6px;vertical-align:2px}
.diff i{width:9px;height:9px;border-radius:50%;background:#E6E1D6;display:block}
.diff i.f{background:var(--coral)}
.foot{margin-top:18px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- mission card ---------- */
.mission{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--sky2);margin-bottom:14px}
.mission .say{width:48px;height:48px;border-radius:50%;background:var(--coral-t);color:var(--coral);display:grid;place-items:center;font-size:22px;flex:none}
.mission .txt{flex:1;min-width:0;font-family:var(--display);font-size:20px;line-height:1.35}
.mission .txt b{font-weight:400}
.guide{display:flex;gap:10px;align-items:flex-start;margin:-4px 0 14px}
.guide .face{width:46px;height:46px;flex:none;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:22px;color:#fff;box-shadow:0 3px 0 var(--sun-d)}
.guide .bub{position:relative;background:var(--cream);border:2px solid #FFE2B8;border-radius:18px;padding:9px 13px;font-size:16px;line-height:1.45}

/* ---------- choose cards ---------- */
.q{font-family:var(--display);font-size:26px;text-align:center;margin:6px 0 2px}
.qsub{text-align:center;color:var(--ink2);margin-bottom:14px}
.qsub b{font-family:var(--display);font-weight:400;padding:2px 10px;border-radius:99px;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.pc{background:var(--paper);border-radius:22px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 var(--sky2);
  font-size:22px;transition:transform .12s}
.pc:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky2)}
.pc .ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:36px}
.pc.hint{animation:pulse 1.1s ease-in-out infinite}
.pc.right{background:var(--ok-t);box-shadow:0 6px 0 #B9E6CD}
.pc.used{opacity:.35;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 6px 0 var(--sky2),0 0 0 8px rgba(255,200,61,.55)}}

/* ---------- map ---------- */
.mapwrap{background:var(--grass-edge);border-radius:26px;padding:8px;box-shadow:0 7px 0 #5F9A3C}
.map{position:relative;display:grid;border-radius:20px;overflow:hidden;background:var(--grass);
  background-image:radial-gradient(var(--grass2) 1.5px,transparent 1.6px);background-size:14px 14px;touch-action:manipulation}
.t{position:relative;aspect-ratio:1}
.t.r{background:var(--road)}
.t.r::after{content:"";position:absolute;inset:0;border:0 solid var(--road-edge)}
.t.c{background:repeating-linear-gradient(90deg,#fff 0 14%,var(--road) 14% 25%)}
.t.x{background:repeating-linear-gradient(45deg,#FFB547 0 10px,#fff 10px 20px)}
.t.x .cone{position:absolute;inset:18%;color:#C2410C;display:grid;place-items:center;font-size:clamp(16px,4vw,28px)}
.t.b{display:flex;justify-content:center;align-items:flex-start}
.bld{width:60%;height:60%;margin-top:3%;border-radius:28%;display:grid;place-items:center;color:#fff;font-size:clamp(13px,3.6vw,26px);box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative}
.tag{position:absolute;left:50%;top:100%;line-height:1.25;transform:translateX(-50%);background:#fff;color:var(--ink);font-family:var(--display);
  font-size:clamp(9px,2.3vw,13px);padding:1px 6px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12);z-index:2}
.flag{position:absolute;top:-18%;right:-30%;white-space:nowrap;font-family:var(--display);font-size:clamp(8px,2vw,11px);color:#fff;padding:1px 5px;border-radius:99px;z-index:3}
.dotp{position:absolute;inset:38%;border-radius:50%;background:var(--coral);opacity:.85}
.nexthint{position:absolute;inset:12%;border-radius:30%;border:4px dashed var(--sun-d);animation:pulse2 1s infinite}
@keyframes pulse2{50%{transform:scale(.85)}}
.seenmark{position:absolute;top:-6%;left:-6%;width:34%;height:34%;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:clamp(8px,2vw,12px);z-index:3}
.me{position:absolute;z-index:5;display:grid;place-items:center;transition:left .22s ease,top .22s ease;pointer-events:none}
.me .body{width:78%;height:78%;border-radius:50%;background:#fff;border:4px solid var(--coral);display:grid;place-items:center;color:var(--coral);
  font-size:clamp(14px,3.8vw,26px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.me.bump .body{animation:shake .35s}
.me.hop .body{animation:hop .22s}
@keyframes hop{50%{transform:translateY(-18%)}}

.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;margin:16px auto 4px;
  grid-template-areas:". u ." "l d r"}
.pad button{border-radius:20px;background:var(--coral);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 5px 0 var(--coral-d)}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.pad button.glow{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:99px;padding:10px 16px;font-size:17px;box-shadow:0 4px 0 var(--sky2)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky2)}
.pill[disabled]{opacity:.45;cursor:default}
.tray{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:12px;min-height:40px}
.tray .lab{font-family:var(--display);color:var(--ink2);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:99px;padding:5px 12px 5px 5px;font-family:var(--display);font-size:16px;box-shadow:0 3px 0 var(--sky2)}
.chip .ci{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:#fff;font-family:var(--display);
  font-size:19px;padding:12px 20px;border-radius:99px;transition:transform .25s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

/* ---------- order ---------- */
.slots{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.slot{width:100px;height:112px;border-radius:20px;border:3px dashed var(--coral);background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:var(--display);font-size:16px;color:var(--coral)}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--paper);color:var(--ink)}
.slot .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px}
.slot.end{border:0;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--sky2)}
.arr{color:var(--ink2);font-size:20px}

/* ---------- clear ---------- */
.overlay{position:fixed;inset:0;background:rgba(36,50,74,.45);display:grid;place-items:center;z-index:40;padding:20px}
.win{background:var(--paper);border-radius:30px;padding:26px 22px 22px;text-align:center;max-width:420px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.15);animation:pop .35s}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.win h2{font-family:var(--display);font-weight:400;font-size:40px;margin:4px 0;color:var(--coral)}
.win .big{display:flex;justify-content:center;gap:8px;font-size:48px;color:#E6E1D6;margin:10px 0}
.win .big .got{color:var(--sun);animation:pop .4s backwards}
.win p{color:var(--ink2);margin:6px 0 16px;font-size:17px}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta{background:var(--coral);color:#fff;border-radius:99px;padding:14px 24px;font-size:20px;box-shadow:0 5px 0 var(--coral-d)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.cta.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:480px){.mission .txt{font-size:18px}.q{font-size:23px}.pad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px)}
  .slot{width:84px;height:100px}.lv .num{width:54px;height:54px}.lv .name{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>

/* ---------- sound + voice ---------- */
let soundOn = true, AC = null;
function tone(seq){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f,d,type]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type||'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); t += d*.85;
    });
  }catch(e){}
}
const SFX = {
  step:()=>tone([[520,.08]]), bump:()=>tone([[180,.18,'square']]),
  good:()=>tone([[660,.12],[880,.18]]), bad:()=>tone([[240,.16],[200,.2]]),
  seen:()=>tone([[784,.1],[1046,.16]]), win:()=>tone([[523,.12],[659,.12],[784,.12],[1046,.32]])
};
function say(text){
  if(!soundOn) return;
  try{ const s = window.speechSynthesis; if(!s) return; s.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.92; s.speak(u);}catch(e){}
}

    const b = h(`<button class="lv" aria-label="${s.name} 시작">
      <span class="num" style="background:${s.color};${s.tutorial?'color:var(--ink)':''}">${s.tutorial?ic('FaPlay'):s.short}</span>
      <span class="meta"><span class="name">${s.name}<span class="diff" aria-label="난이도 ${s.diff}">${[1,2,3,4].map(k=>`<i class="${k<=s.diff?'f':''}"></i>`).join('')}</span></span>
        <span class="desc" style="display:block">${s.desc}</span></span>
      <span class="stars" aria-label="별 ${got}개">${starsHTML(got)}</span></button>`);
    b.onclick = () => startStage(i);
    tr.appendChild(b);
  });
  document.getElementById('snd').onclick = toggleSound;
}
function toggleSound(){ soundOn=!soundOn; const b=document.getElementById('snd'); if(b) b.innerHTML=ic(soundOn?'FaVolumeUp':'FaVolumeMute'); if(!soundOn){try{speechSynthesis.cancel()}catch(e){}} }

/* ---------- STAGE ---------- */
let G = null;
function startStage(i){
  const s = STAGES[i];
  G = { i, s, step:1, mistakes:0, hintsLeft: s.hint==='free'?Infinity:s.hint, seen:[], visitedVia:false };
  parseMap();
  renderStep();
}
function parseMap(){
  const s=G.s; G.rows=s.map.length; G.cols=s.map[0].length; G.grid=[]; G.bld={};
  for(let r=0;r<G.rows;r++){ G.grid.push([]); for(let c=0;c<G.cols;c++){
    const ch=s.map[r][c]; let t={k:'g'};
    if(ch==='R') t={k:'r'}; else if(ch==='C') t={k:'c'}; else if(ch==='X') t={k:'x'};
    else if(ch==='S'){ t={k:'r'}; G.startPos=[r,c]; } else if(ch==='G'){ t={k:'r'}; G.goalPos=[r,c]; }
    else if(s.legend[ch]){ t={k:'b',p:s.legend[ch]}; G.bld[s.legend[ch]]=[r,c]; }
    G.grid[r].push(t);
  }}
  G.pos = G.startPos.slice(); G.drawnPos = null;
}
const walk = (r,c) => r>=0&&c>=0&&r<G.rows&&c<G.cols && (G.grid[r][c].k==='r'||G.grid[r][c].k==='c');

function shell(){
  const s=G.s, labels=['출발지','목적지','길찾기','순서'];
  $app.innerHTML = `
  <div class="bar">
    <button class="round" id="back" aria-label="처음 화면으로">${ic('FaChevronLeft')}</button>
    <div class="ttl">${s.name} · 길찾기 미션</div>
    <button class="round" id="snd" aria-label="소리 켜기/끄기">${ic(soundOn?'FaVolumeUp':'FaVolumeMute')}</button>
  </div>
  <div class="steps">${labels.map((l,k)=>`<span class="${k+1===G.step?'on':k+1<G.step?'done':''}">${k+1<G.step?'✓ ':''}${k+1}. ${l}</span>`).join('')}</div>
  <div class="mission"><button class="say" id="say" aria-label="미션 읽어 주기">${ic('FaVolumeUp')}</button>
    <div class="txt">${storyHTML(s)}</div></div>
  ${s.tutorial?`<div class="guide"><div class="face">${ic('FaStar')}</div><div class="bub" id="bub">${GUIDE[G.step]}</div></div>`:''}
  <div id="stage"></div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('snd').onclick = toggleSound;
  document.getElementById('say').onclick = () => say(s.storyText);
  return document.getElementById('stage');
}

function renderStep(){
  if(G.step===1||G.step===2) return chooseStep();
  if(G.step===3) return mapStep();
  if(G.step===4) return orderStep();
}

/* step 1 & 2: choose start / goal */
function chooseStep(){
  const box = shell(), isStart = G.step===1, s=G.s;
  const answer = isStart ? s.start : s.goal;
  const q = isStart ? '출발지는 어디예요?' : '목적지는 어디예요?';
  box.appendChild(h(`<div><div class="q">${q}</div>
    <div class="qsub">${isStart?'<b style="background:var(--ok)">출발지</b> = 지금 내가 있는 곳':'<b style="background:var(--coral)">목적지</b> = 내가 가고 싶은 곳'}</div>
    <div class="cards" id="cards"></div></div>`));
  const wrap = document.getElementById('cards');
  const order = s.tutorial ? s.choices : shuffle(s.choices);
  order.forEach(k => {
    const p=PLACES[k];
    const b=h(`<button class="pc" aria-label="${p.n}">${icoBadge(k)}<span>${p.n}</span></button>`);
    if(!isStart && k===s.start){ b.classList.add('used'); b.setAttribute('aria-disabled','true'); }
    if(s.tutorial && k===answer) setTimeout(()=>b.classList.add('hint'), 2500);
    b.onclick = () => {
      if(k===answer){
        b.classList.remove('hint'); b.classList.add('right'); SFX.good();
        const m = `맞아요! ${isStart?'출발지':'목적지'}는 ${p.n}${has받침(p.n)?'이에요':'예요'}.`;
        toast(m); say(m);
        setTimeout(()=>{ G.step++; renderStep(); }, 1100);
      } else {
        G.mistakes++; SFX.bad(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        const m = `${p.n}${has받침(p.n)?'은':'는'} ${isStart?'출발지가':'목적지가'} 아니에요. 다시 찾아봐요!`;
        toast(m); say(m);
      }
    };
    wrap.appendChild(b);
  });
  if(s.tutorial) say(GUIDE[G.step]); else say(q);
}

/* step 3: map */
function bfs(from,to){
  const key=(r,c)=>r*100+c, prev=new Map([[key(...from),null]]), q=[from];
  while(q.length){ const [r,c]=q.shift(); if(r===to[0]&&c===to[1]) break;
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){ const nr=r+dr,nc=c+dc; if(walk(nr,nc)&&!prev.has(key(nr,nc))){prev.set(key(nr,nc),[r,c]); q.push([nr,nc]);} } }
  if(!prev.has(key(...to))) return null;
  const path=[]; let cur=to; while(cur){ path.unshift(cur); cur=prev.get(key(...cur)); } return path;
}
function viaTarget(){ // nearest road tile next to the via building
  const [br,bc]=G.bld[G.s.via]; let best=null;
  for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){ const r=br+dr,c=bc+dc; if(walk(r,c)){ const p=bfs(G.pos,[r,c]); if(p&&(!best||p.length<best.length)) best=p; } }
  return best;
}
function mapStep(){
  const box = shell(), s=G.s;
  G.walked = new Set([G.pos.join()]);
  G.guide = s.path ? bfs(G.startPos,G.goalPos).map(p=>p.join()) : [];
  const viaTxt = s.via ? `<b>${PLACES[s.via].n}</b>에 들렀다가 ` : '';
  box.appendChild(h(`<div>
    <div class="q" style="font-size:22px">${PLACES[s.start].n}에서 ${viaTxt.replace(/<\/?b>/g,'')}${PLACES[s.goal].n}까지 가요</div>
    <div class="qsub">${s.path?'빨간 점을 따라가요':'길을 스스로 찾아요'}${s.via?' · 공사 중인 길은 못 지나가요':''}</div>
    <div class="mapwrap"><div class="map" id="map" style="grid-template-columns:repeat(${G.cols},1fr)"></div></div>
    <div class="pad" id="pad">
      <button style="grid-area:u" data-d="u" aria-label="위로">${ic('FaArrowUp')}</button>
      <button style="grid-area:l" data-d="l" aria-label="왼쪽으로">${ic('FaArrowLeft')}</button>
      <button style="grid-area:d" data-d="d" aria-label="아래로">${ic('FaArrowDown')}</button>
      <button style="grid-area:r" data-d="r" aria-label="오른쪽으로">${ic('FaArrowRight')}</button>
    </div>
    <div class="tools">
      <button class="pill" id="hintb">${ic('FaLightbulb')} 힌트${G.hintsLeft!==Infinity?` <span id="hl">(${G.hintsLeft})</span>`:''}</button>
      <button class="pill" id="resetb">${ic('FaRedo')} 처음부터</button>
    </div>
    ${s.tray?`<div class="tray" id="tray"><span class="lab">지나온 곳</span></div>`:''}
  </div>`));
  drawMap();
  document.querySelectorAll('#pad button').forEach(b => b.onclick = () => move(b.dataset.d));
  document.getElementById('hintb').onclick = showHint;
  document.getElementById('resetb').onclick = () => { G.pos=G.startPos.slice(); G.drawnPos=null; G.seen=[]; G.visitedVia=false; G.walked=new Set([G.pos.join()]); drawMap(); const t=document.getElementById('tray'); if(t) t.innerHTML='<span class="lab">지나온 곳</span>'; };
  if(s.tutorial) say(GUIDE[3]); else say(`${PLACES[s.start].n}에서 ${s.via?PLACES[s.via].n+'에 들렀다가 ':''}${PLACES[s.goal].n}까지 가요.`);
}
function drawMap(hintPos){
  const m = document.getElementById('map'); if(!m) return;
  m.innerHTML='';
  for(let r=0;r<G.rows;r++) for(let c=0;c<G.cols;c++){
    const t=G.grid[r][c]; const d=document.createElement('div');
    d.className='t '+({g:'',r:'r',c:'c',x:'x',b:'b'}[t.k]);
    if(t.k==='x') d.innerHTML=`<span class="cone">${ic('MdConstruction')}</span>`;
    if(t.k==='b'){ const p=PLACES[t.p];
      let flag='';
      if(t.p===G.s.start) flag=`<span class="flag" style="background:var(--ok)">출발</span>`;
      if(t.p===G.s.goal) flag=`<span class="flag" style="background:var(--coral)">도착</span>`;
      if(t.p===G.s.via) flag=`<span class="flag" style="background:var(--sun-d)">들르기</span>`;
      const seen = G.seen.includes(t.p) ? `<span class="seenmark">${ic('FaCheck')}</span>`:'';
      d.innerHTML=`<div class="bld" style="background:${p.c}">${ic(p.i)}${flag}${seen}<span class="tag">${p.n}</span></div>`;
    }
    const k=r+','+c;
    if(G.guide.includes(k) && !G.walked.has(k) && !(r===G.pos[0]&&c===G.pos[1])) d.insertAdjacentHTML('beforeend','<span class="dotp"></span>');
    if(hintPos && hintPos[0]===r && hintPos[1]===c) d.insertAdjacentHTML('beforeend','<span class="nexthint"></span>');
    d.onclick = () => { const dr=r-G.pos[0], dc=c-G.pos[1]; if(Math.abs(dr)+Math.abs(dc)===1) move(dr===-1?'u':dr===1?'d':dc===-1?'l':'r'); };
    m.appendChild(d);
  }
  const me=document.createElement('div'); me.className='me'; me.id='me';
  me.style.width=(100/G.cols)+'%'; me.style.height=(100/G.rows)+'%';
  const from = G.drawnPos || G.pos;
  me.style.left=(from[1]*100/G.cols)+'%'; me.style.top=(from[0]*100/G.rows)+'%';
  me.innerHTML=`<div class="body">${ic('FaChild')}</div>`;
  m.appendChild(me);
  if(from!==G.pos){ void me.offsetWidth; me.style.left=(G.pos[1]*100/G.cols)+'%'; me.style.top=(G.pos[0]*100/G.rows)+'%'; }
  G.drawnPos = G.pos;
}
function move(dir){
  if(G.step!==3 || G.busy) return;
  const [dr,dc]={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]}[dir];
  const nr=G.pos[0]+dr, nc=G.pos[1]+dc, me=document.getElementById('me');
  document.querySelectorAll('#pad button').forEach(b=>b.classList.remove('glow'));
  if(!walk(nr,nc)){
    SFX.bump(); me.classList.remove('bump'); void me.offsetWidth; me.classList.add('bump');
    const t = (nr>=0&&nc>=0&&nr<G.rows&&nc<G.cols) ? G.grid[nr][nc] : null;
    toast(t&&t.k==='x' ? '공사 중이라 지나갈 수 없어요!' : t&&t.k==='b' ? `${PLACES[t.p].n}${has받침(PLACES[t.p].n)?'은':'는'} 건물이에요. 길로 가요!` : '여기는 길이 아니에요!');
    return;
  }
  G.pos=[nr,nc]; G.walked.add(nr+','+nc); SFX.step();
  drawMap();
  checkSeen();
  if(nr===G.goalPos[0]&&nc===G.goalPos[1]){
    if(G.s.via && !G.visitedVia){ toast(`앗! ${PLACES[G.s.via].n}에 먼저 들러야 해요.`); say(`${PLACES[G.s.via].n}에 먼저 들러야 해요.`); return; }
    G.busy=true; SFX.win(); const m=`${PLACES[G.s.goal].n}에 도착했어요!`; toast(m); say(m);
    setTimeout(()=>{ G.busy=false; G.step=4; renderStep(); }, 1500);
  }
}
function checkSeen(){
  const [r,c]=G.pos, found=[];
  if(G.grid[r][c].k==='c') found.push('crosswalk');
  for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){ const t=G.grid[r+dr]&&G.grid[r+dr][c+dc]; if(t&&t.k==='b') found.push(t.p); }
  found.forEach(p => {
    if(p===G.s.via) G.visitedVia = true;
    if(p===G.s.start||p===G.s.goal||G.seen.includes(p)) return;
    G.seen.push(p); SFX.seen();
    const m = `${eul(PLACES[p].n)} 지나요!`; toast(m); say(m);
    const tr=document.getElementById('tray');
    if(tr) tr.appendChild(h(`<span class="chip">${icoBadge(p,'ci')}${PLACES[p].n}</span>`));
    if(p!=='crosswalk'){ const [br,bc]=G.bld[p]; const tile=document.getElementById('map').children[br*G.cols+bc]; const b=tile&&tile.querySelector('.bld'); if(b) b.insertAdjacentHTML('beforeend',`<span class="seenmark">${ic('FaCheck')}</span>`); }
  });
}
function showHint(){
  if(G.hintsLeft<=0){ toast('힌트를 다 썼어요. 스스로 해 봐요!'); return; }
  let path = (G.s.via && !G.visitedVia) ? viaTarget() : bfs(G.pos,G.goalPos);
  if(!path || path.length<2){ toast('주변을 둘러봐요!'); return; }
  const [nr,nc]=path[1], dr=nr-G.pos[0], dc=nc-G.pos[1];
  const dir = dr===-1?'u':dr===1?'d':dc===-1?'l':'r';
  if(G.hintsLeft!==Infinity){ G.hintsLeft--; const hl=document.getElementById('hl'); if(hl) hl.textContent=`(${G.hintsLeft})`; if(G.hintsLeft<=0) document.getElementById('hintb').disabled=true; }
  drawMap([nr,nc]);
  document.querySelector(`#pad button[data-d="${dir}"]`).classList.add('glow');
  const w={u:'위로',d:'아래로',l:'왼쪽으로',r:'오른쪽으로'}[dir]; toast(`${w} 가 봐요!`); say(`${w} 가 봐요.`);
}

/* step 4: order */
function orderStep(){
  const box=shell(), s=G.s;
  const answer = G.seen.slice(0,4);
  if(!answer.length){ return finish(); }
  const allLand = Object.keys(G.bld).filter(p=>p!==s.start&&p!==s.goal);
  if(s.map.some(row=>row.includes('C'))) allLand.push('crosswalk');
  const distract = shuffle(allLand.filter(p=>!answer.includes(p))).slice(0, s.tutorial?1:2);
  const pool = shuffle(answer.concat(distract));
  G.filled = 0;
  box.appendChild(h(`<div><div class="q">지나온 곳을 순서대로 눌러요</div>
    <div class="qsub">${s.tutorial?'처음 본 곳부터 차례대로!':'지나오지 않은 곳도 섞여 있어요'}</div>
    <div class="slots" id="slots"></div><div class="cards" id="pool"></div></div>`));
  const sl=document.getElementById('slots');
  sl.appendChild(h(`<div class="slot end">${icoBadge(s.start)}${PLACES[s.start].n}</div>`));
  answer.forEach((_,k)=>{ sl.appendChild(h(`<span class="arr">${ic('FaArrowRight')}</span>`)); sl.appendChild(h(`<div class="slot" id="slot${k}">${k+1}</div>`)); });
  sl.appendChild(h(`<span class="arr">${ic('FaArrowRight')}</span>`));
  sl.appendChild(h(`<div class="slot end">${icoBadge(s.goal)}${PLACES[s.goal].n}</div>`));
  const pw=document.getElementById('pool');
  pool.forEach(p => {
    const b=h(`<button class="pc" aria-label="${PLACES[p].n}">${icoBadge(p)}<span>${PLACES[p].n}</span></button>`);
    if(s.tutorial && p===answer[0]) setTimeout(()=>{ if(G.filled===0) b.classList.add('hint'); }, 3000);
    b.onclick = () => {
      if(p===answer[G.filled]){
        const slot=document.getElementById('slot'+G.filled);
        slot.classList.add('fill'); slot.innerHTML=`${icoBadge(p)}${PLACES[p].n}`;
        b.classList.remove('hint'); b.classList.add('used'); SFX.good(); G.filled++;
        if(G.filled===answer.length){ toast('순서를 모두 맞혔어요!'); say('순서를 모두 맞혔어요!'); setTimeout(finish, 1200); }
        else if(s.tutorial){ const nb=[...pw.children].find(x=>x.getAttribute('aria-label')===PLACES[answer[G.filled]].n); setTimeout(()=>{ if(nb && !nb.classList.contains('used')) nb.classList.add('hint'); }, 3000); }
      } else {
        G.mistakes++; SFX.bad(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        const m = answer.includes(p) ? '그건 조금 뒤에 봤어요. 다시 생각해 봐요!' : `${PLACES[p].n}${has받침(PLACES[p].n)?'은':'는'} 지나오지 않았어요!`;
        toast(m); say(m);
      }
    };
    pw.appendChild(b);
  });
  say(s.tutorial ? GUIDE[4] : '지나온 곳을 순서대로 눌러요.');
}

/* clear */
function finish(){
  const stars = G.mistakes<=1?3:G.mistakes<=3?2:1;
  const id=G.s.id; STARS[id]=Math.max(STARS[id]||0,stars); saveStars(STARS);
  const next = G.i+1<STAGES.length ? STAGES[G.i+1] : null;
  const ov = h(`<div class="overlay" role="dialog" aria-label="미션 성공"><div class="win">
    <div style="font-family:var(--display);color:var(--ink2);font-size:18px">${G.s.name}</div>
    <h2>미션 성공!</h2>
    <div class="big">${[0,1,2].map(k=>`<span class="${k<stars?'got':''}" style="animation-delay:${.15+k*.18}s">${ic('FaStar')}</span>`).join('')}</div>
    <p>${stars===3?'완벽해요! 혼자서 길을 찾았어요.':stars===2?'잘했어요! 조금만 더 연습하면 완벽해요.':'끝까지 해냈어요! 한 번 더 해 볼까요?'}</p>
    <div class="btnrow">
      <button class="cta alt" id="again">${'다시 하기'}</button>
      ${next?`<button class="cta" id="next">${next.name} 하러 가기</button>`:`<button class="cta" id="next">처음 화면</button>`}
    </div></div></div>`);
  document.body.appendChild(ov);
  confetti(); say(`미션 성공! 별 ${stars}개를 받았어요.`);
  ov.querySelector('#again').onclick = () => { ov.remove(); startStage(G.i); };
  ov.querySelector('#next').onclick = () => { ov.remove(); next ? startStage(G.i+1) : home(); };
}

function confetti(){
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FF6960','#FFC83D','#4A90D9','#2EA36B','#8E6BD8'];
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,
    s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();});
    if(++f<180) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

document.addEventListener('keydown', e => {
  const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];
  if(m && G && G.step===3 && !document.querySelector('.overlay')){ e.preventDefault(); move(m); }
});
home();
</script>
