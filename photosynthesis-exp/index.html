<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>새싹 박사 광합성 탐구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: 앱형 3단 — 위 머리띠(진행 잎사귀) / 가운데 그림+학습지 문장 / 아래 고정 답 고르기 칸 */
:root{
  --paper:#f2f7ea; --grid:#e0ead2; --card:#fffdf6; --ink:#24382a; --ink2:#5c705f;
  --leaf:#3c9d58; --leaf-d:#2a7a42; --leaf-l:#dff2e1;
  --sun:#ffc83d; --sun-l:#fff2c9; --btb:#2f7fd6;
  --coral:#ff7b54; --coral-l:#ffe4da; --line:#d5e1c8;
  --display:"Jua","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--btb);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- 머리띠 ---------- */
.top{
  display:flex;align-items:center;gap:12px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--card);border-bottom:3px solid var(--line);
}
.back{width:52px;height:52px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:24px;flex:none;font-family:var(--display)}
.back:active{transform:scale(.95)}
.leaves{display:flex;gap:6px;flex:1;min-width:0;justify-content:center;flex-wrap:wrap}
.leafdot{width:34px;height:34px;flex:none}
.leafdot path{stroke:var(--ink);stroke-width:2.5}
.page{font-family:var(--display);font-size:18px;background:var(--sun-l);border:3px solid var(--sun);border-radius:999px;padding:6px 14px;flex:none;white-space:nowrap}

/* ---------- 가운데 ---------- */
.main{flex:1;overflow:auto;padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:20px;align-items:start}
.art{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:12px;box-shadow:6px 6px 0 var(--line);position:sticky;top:0}
.art svg{display:block;width:100%;height:auto;max-height:52vh}
.work{display:flex;flex-direction:column;gap:14px;min-width:0}
.coach{display:flex;align-items:flex-end;gap:10px}
.coach svg{width:74px;flex:none}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-family:var(--display);font-size:22px;line-height:1.35;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-14px;bottom:16px;border:7px solid transparent;border-right:9px solid var(--ink)}
.bubble.good{background:var(--leaf-l);border-color:var(--leaf-d)}
.bubble.oops{background:var(--coral-l);border-color:var(--coral)}
.bubble .hint{display:block;font-family:var(--body);font-size:17px;color:var(--ink2);margin-top:4px}
.sec{font-family:var(--display);font-size:17px;color:var(--leaf-d);letter-spacing:.02em}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,34px);margin:0;text-wrap:balance;line-height:1.2}
.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 18px;transition:opacity .2s}
.item.now{border-color:var(--coral);box-shadow:0 0 0 5px var(--coral-l)}
.item.later{opacity:.42}
.item.info{background:transparent;border-style:dashed;font-size:20px;line-height:1.5}
.sent{font-size:clamp(20px,2.3vw,25px);line-height:2.15;margin:0;word-break:keep-all}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.2em;height:1.7em;padding:0 .4em;margin:0 .15em;border-radius:12px;border:3px dashed #b9c6ad;background:#fff;vertical-align:middle;font-family:var(--display);font-weight:400;line-height:1}
.blank.now{border:3px solid var(--coral);background:var(--coral-l);color:var(--coral);animation:breathe 1.4s ease-in-out infinite}
.blank.done{border:3px solid var(--leaf);background:var(--leaf-l);color:var(--leaf-d)}
.blank.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;font-size:clamp(20px,2.3vw,24px)}
.pick .blank{min-width:5.6em;height:1.9em}
.taps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tapc{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;line-height:1.3;text-align:center;word-break:keep-all;box-shadow:0 5px 0 var(--line);position:relative}
.tapc svg{width:min(88px,100%);height:auto}
.tapc .cover{position:absolute;inset:0;border-radius:15px;background:var(--sun-l);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:46px;color:#d29b00}
.tapc.seen{border-color:var(--leaf);background:var(--leaf-l)}
.tapc:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}

/* ---------- 아래 고르기 칸 ---------- */
.dock{background:var(--card);border-top:3px solid var(--ink);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.dock-label{font-family:var(--display);font-size:18px;color:var(--ink2)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.opt{min-width:132px;flex:0 1 170px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.opt svg{width:58px;height:58px}
.opt span{font-family:var(--display);font-size:24px;line-height:1.15;word-break:keep-all;text-align:center}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.nope{opacity:.3;box-shadow:0 2px 0 var(--ink);transform:translateY(4px);pointer-events:none}
.opt.shake{animation:shake .4s}
.opt.glow{border-color:var(--leaf);box-shadow:0 6px 0 var(--leaf-d),0 0 0 6px #bfe8c6;animation:breathe 1s ease-in-out infinite}
.next{font-family:var(--display);font-size:30px;background:var(--leaf);color:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 40px;box-shadow:0 7px 0 var(--ink);animation:breathe 1.4s ease-in-out infinite}
.next:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}

/* ---------- 시작 화면 ---------- */
.start{max-width:880px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding-block:10px}
.start .hero svg{width:min(250px,40vw)}
.kicker{font-family:var(--display);font-size:20px;color:var(--leaf-d)}
.start h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,64px);margin:4px 0 8px;line-height:1.05;text-wrap:balance}
.start h1 em{font-style:normal;color:var(--leaf);}
.start p{font-size:20px;line-height:1.6;margin:0 0 16px;color:var(--ink2)}
.namebox{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.namebox label{font-family:var(--display);font-size:22px}
.namebox input{font:inherit;font-size:26px;padding:12px 16px;border-radius:16px;border:3px solid var(--ink);background:#fff;width:100%;max-width:340px;color:var(--ink)}
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.plan div{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.4}
.plan b{font-family:var(--display);font-weight:400;font-size:20px;display:block;color:var(--leaf-d)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ghost{font-family:var(--display);font-size:18px;background:transparent;border:3px dashed #b9c6ad;border-radius:14px;padding:8px 14px;color:var(--ink2)}
.ghost.warn{border-color:var(--coral);color:var(--coral);border-style:solid}

/* ---------- 결과 카드 ---------- */
.final{max-width:980px;margin:0 auto;background:var(--card);border:4px solid var(--ink);border-radius:30px;padding:22px clamp(16px,3vw,32px);box-shadow:8px 8px 0 var(--line);position:relative}
.final-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:3px dashed var(--line);padding-bottom:14px;margin-bottom:16px}
.final-head svg{width:76px}
.final-head h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,42px);margin:0;line-height:1.1}
.final-head .who{font-size:20px;color:var(--ink2)}
.stamp{position:absolute;right:22px;top:16px;width:118px;height:118px;border-radius:50%;border:5px double var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:21px;line-height:1.15;transform:rotate(-12deg);background:rgba(255,255,255,.6)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.res section{border:3px solid var(--line);border-radius:22px;padding:12px 14px;min-width:0}
.res h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px}
.res svg{width:100%;height:auto;display:block}
.res ul{margin:8px 0 0;padding-left:1.1em;font-size:18px;line-height:1.6}
.learn{margin-top:16px;background:var(--sun-l);border:3px solid var(--sun);border-radius:22px;padding:14px 18px}
.learn h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px}
.learn p{font-size:21px;margin:4px 0;line-height:1.6}
.learn mark{background:#fff;border:2px solid var(--leaf);border-radius:8px;padding:0 6px;color:var(--leaf-d);font-family:var(--display);font-weight:400}
.fav{margin-top:16px}
.fav h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 8px;font-family:var(--display);font-size:20px}
.chip svg{width:40px;height:40px}
.chip.on{background:var(--leaf-l);border-color:var(--leaf-d);box-shadow:0 0 0 4px #bfe8c6}
.shot{margin-top:16px;font-size:19px;color:var(--ink2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shot b{font-family:var(--display);font-weight:400;color:var(--ink);font-size:21px}

@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:780px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .art{position:static}
  .art svg{max-height:34vh}
  .start{grid-template-columns:minmax(0,1fr);text-align:left}
  .start .hero{display:flex;justify-content:center}
  .res{grid-template-columns:minmax(0,1fr)}
  .stamp{width:92px;height:92px;font-size:17px;right:12px;top:12px}
  .opt{min-width:104px;flex-basis:130px}
  .opt svg{width:46px;height:46px}
  .opt span{font-size:20px}
  .leafdot{width:26px;height:26px}
  .page{font-size:15px;padding:4px 10px}
  .taps{grid-template-columns:minmax(0,1fr)}
  .tapc{flex-direction:row;text-align:left}
  .tapc svg{width:60px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gSun" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fff6b8"/><stop offset="1" stop-color="#ffbf2e"/></radialGradient>
    <linearGradient id="gFoil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset=".45" stop-color="#c9d0d7"/><stop offset=".7" stop-color="#eef1f4"/><stop offset="1" stop-color="#9ea8b2"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient>
    <linearGradient id="gSoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87149"/><stop offset="1" stop-color="#7a4d2f"/></linearGradient>
    <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e88559"/><stop offset="1" stop-color="#c2552f"/></linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8bd673"/><stop offset="1" stop-color="#3b9a50"/></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b27a"/><stop offset="1" stop-color="#c08850"/></linearGradient>
    <radialGradient id="gBub" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fd6ff"/></radialGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8f3fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
</svg>

<div id="app"></div>

<script>
(function(){
const INK = '#24382a';
const C = { blue:'#3a86dc', yellow:'#f6cc3b', red:'#e5533d', green:'#5bb85a', navy:'#2c2f6e', iodine:'#d9893a', none:'#e4eaef' };
const SW = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x,y,s,txt,extra='') => `<text x="${x}" y="${y}" font-family="Jua, sans-serif" font-size="${s}" text-anchor="middle" ${extra} fill="${INK}">${txt}</text>`;

/* ============ 그림 조각 ============ */
function sun(cx,cy,r,face=true){
  let rays='';
  for(let i=0;i<12;i++){const a=i*Math.PI/6, r1=r+5, r2=r+(i%2?11:16);
    rays+=`<line x1="${cx+Math.cos(a)*r1}" y1="${cy+Math.sin(a)*r1}" x2="${cx+Math.cos(a)*r2}" y2="${cy+Math.sin(a)*r2}" stroke="#ffaa00" stroke-width="${Math.max(3,r/6)}" stroke-linecap="round"/>`;}
  const f = face ? `<circle cx="${cx-r*.33}" cy="${cy-r*.1}" r="${r*.09}" fill="${INK}"/><circle cx="${cx+r*.33}" cy="${cy-r*.1}" r="${r*.09}" fill="${INK}"/>
    <path d="M${cx-r*.3} ${cy+r*.22} Q${cx} ${cy+r*.5} ${cx+r*.3} ${cy+r*.22}" fill="none" stroke="${INK}" stroke-width="${Math.max(2,r/10)}" stroke-linecap="round"/>
    <ellipse cx="${cx-r*.55}" cy="${cy+r*.2}" rx="${r*.14}" ry="${r*.09}" fill="#ff9a7a" opacity=".7"/><ellipse cx="${cx+r*.55}" cy="${cy+r*.2}" rx="${r*.14}" ry="${r*.09}" fill="#ff9a7a" opacity=".7"/>` : '';
  return rays+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#gSun)" ${SW}/>`+f;
}
function leaf(x,y,s,rot,fill='url(#gLeaf)',vein=true){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <path d="M0 -40 C28 -30 32 18 0 42 C-32 18 -28 -30 0 -40Z" fill="${fill}" stroke="${INK}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${vein?`<path d="M0 -30 L0 38 M0 -6 L12 -16 M0 10 L15 0 M0 -6 L-12 -16 M0 10 L-15 0" stroke="rgba(20,50,25,.28)" stroke-width="2" vector-effect="non-scaling-stroke" fill="none" stroke-linecap="round"/>`:''}
  </g>`;
}
function foilBlob(x,y,rx,ry){
  const pts=[]; for(let i=0;i<14;i++){const a=i/14*Math.PI*2, k=i%2?0.86:1.04; pts.push(`${(x+Math.cos(a)*rx*k).toFixed(1)},${(y+Math.sin(a)*ry*k).toFixed(1)}`);}
  return `<polygon points="${pts.join(' ')}" fill="url(#gFoil)" ${SW}/>
    <path d="M${x-rx*.5} ${y-ry*.3} l${rx*.25} ${ry*.25} l${rx*.2} ${-ry*.2} l${rx*.25} ${ry*.3} M${x-rx*.4} ${y+ry*.35} l${rx*.3} ${-ry*.2} l${rx*.3} ${ry*.25}" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M${x-rx*.2} ${y+ry*.05} l${rx*.35} ${-ry*.1}" stroke="#8d97a1" stroke-width="2" fill="none" stroke-linecap="round"/>`;
}
function bubble(x,y,r,label,fill='url(#gBub)',fs){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${SW}/><ellipse cx="${x-r*.38}" cy="${y-r*.4}" rx="${r*.2}" ry="${r*.13}" fill="#fff" transform="rotate(-30 ${x-r*.38} ${y-r*.4})"/>`+
    (label?T(x,y+(fs||r*.62)*.36,fs||r*.62,label):'');
}
function cloud(x,y,s,label,fill='#cfd5dc'){
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30 14 a14 14 0 0 1 2 -27 a18 18 0 0 1 33 -6 a14 14 0 0 1 23 10 a12 12 0 0 1 2 23Z" fill="${fill}" stroke="${INK}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${label?T(0,8,17,label):''}</g>`;
}
function arrow(x1,y1,x2,y2,color,w=7,dash=''){
  const a=Math.atan2(y2-y1,x2-x1), h=w*2.4;
  const bx=x2-Math.cos(a)*h, by=y2-Math.sin(a)*h;
  const p1=`${bx+Math.cos(a+Math.PI/2)*h*.7},${by+Math.sin(a+Math.PI/2)*h*.7}`, p2=`${bx+Math.cos(a-Math.PI/2)*h*.7},${by+Math.sin(a-Math.PI/2)*h*.7}`;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/><polygon points="${x2},${y2} ${p1} ${p2}" fill="${color}" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
}
function tag(x,y,txt,bg='#fff',fs=17,stroke=INK){
  const w = Math.max(44, txt.length*fs*.92+18);
  return `<rect x="${x-w/2}" y="${y-fs*.95}" width="${w}" height="${fs*1.5}" rx="${fs*.6}" fill="${bg}" stroke="${stroke}" stroke-width="2.5"/>`+T(x,y+fs*.12,fs,txt);
}
function elodea(x,y1,y2){
  let s=`<path d="M${x} ${y2} C${x-7} ${(y1+y2)/2+25} ${x+7} ${(y1+y2)/2-25} ${x} ${y1}" stroke="#2c6f35" stroke-width="3" fill="none"/>`;
  for(let y=y2-8;y>y1+4;y-=11){
    s+=`<ellipse cx="${x-8}" cy="${y}" rx="8" ry="2.8" fill="#4fae4f" transform="rotate(-28 ${x-8} ${y})"/><ellipse cx="${x+8}" cy="${y-5}" rx="8" ry="2.8" fill="#3f9a45" transform="rotate(28 ${x+8} ${y-5})"/>`;
  }
  return s;
}
function tube(x,y,o={}){
  const w=o.w||24,h=o.h||150, lt=y+(o.lt||55);
  const body=`M${x-w} ${y} V${y+h} a${w} ${w} 0 0 0 ${2*w} 0 V${y}`;
  const liq=`M${x-w+3} ${lt} V${y+h} a${w-3} ${w-3} 0 0 0 ${2*w-6} 0 V${lt}Z`;
  let s=`<g opacity="${o.dim?.4:1}">`;
  if(o.focus) s+=`<rect x="${x-w-14}" y="${y-30}" width="${2*w+28}" height="${h+w+50}" rx="20" fill="#ffe4da" stroke="#ff7b54" stroke-width="3" stroke-dasharray="8 6"/>`;
  s+=`<path d="${body}" fill="url(#gGlass)" stroke="${INK}" stroke-width="3"/><path d="${liq}" fill="${o.color||C.none}"/>`;
  if(o.color) s+=`<path d="M${x-w+3} ${lt} H${x+w-3}" stroke="rgba(255,255,255,.7)" stroke-width="3"/>`;
  if(o.elodea) s+=elodea(x,lt-6,y+h+w-8);
  if(o.bubbles) s+=`<circle cx="${x+10}" cy="${lt+30}" r="3.5" fill="#fff" stroke="${INK}" stroke-width="1.5"/><circle cx="${x+6}" cy="${lt+14}" r="2.5" fill="#fff" stroke="${INK}" stroke-width="1.5"/><circle cx="${x-10}" cy="${lt+44}" r="3" fill="#fff" stroke="${INK}" stroke-width="1.5"/>`;
  if(o.q) s+=T(x,y+h-14,30,'?','fill="#8a97a3"');
  s+=`<path d="${body}" fill="none" stroke="${INK}" stroke-width="3"/><path d="M${x-w+8} ${y+14} V${y+h-6}" stroke="#fff" stroke-width="4" opacity=".85" stroke-linecap="round"/>`;
  s+=`<rect x="${x-w-5}" y="${y-8}" width="${2*w+10}" height="11" rx="5" fill="#f4f9fc" stroke="${INK}" stroke-width="3"/>`;
  if(o.foil){
    const yb = o.foil==='half' ? y+68 : y+h+w+4;
    s+=`<path d="M${x-w-7} ${y-4} L${x-w+6} ${y-10} L${x+4} ${y-5} L${x+w+8} ${y-9} L${x+w+9} ${yb-6} L${x+w-6} ${yb+4} L${x} ${yb-3} L${x-w-5} ${yb+5}Z" fill="url(#gFoil)" ${SW}/>`;
    for(let yy=y+14; yy<yb-10; yy+=26) s+=`<path d="M${x-w+2} ${yy} l12 8 l10 -7 l14 9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M${x-w+6} ${yy+14} l18 -4" stroke="#8d97a1" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }
  if(o.letter){ s+=`<circle cx="${x}" cy="${y-30}" r="15" fill="#fff" ${SW}/>`+T(x,y-22,22,o.letter); }
  return s+'</g>';
}

      it.parts=it.text.split(/(\{[^}]+\})/).filter(Boolean).map(s=>s[0]==='{'?{a:s.slice(1,-1)}:s);
      it.parts.filter(x=>typeof x==='object').forEach(b=>sc.steps.push({ii,a:b.a,opts:it.opts,h:it.h,kind:'fill'}));

  });
});

const ORDERS={};
let miss=0, nope=new Set(), order=null, orderKey='', msg=null, popKey='', tapped=new Set(), resetArm=false;
const PRAISE=['딩동댕! 맞았어요!','최고예요!','잘했어요!','정답이에요!','멋진 과학자!'];
const app=document.getElementById('app');
const prog = i => st.prog[i]||0;
const done = i => prog(i) >= SCREENS[i].steps.length;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function go(i){ st.cur=i; miss=0; nope=new Set(); msg=null; tapped=new Set(); order=null; save(); render(); const m=document.querySelector('.main'); if(m) m.scrollTop=0; }

function leafDots(){
  const cur = SCREENS[st.cur]?.sec ?? -1;
  return SECS.map((s,i)=>{
    const all = SCREENS.map((sc,k)=>[sc,k]).filter(([sc])=>sc.sec===i).every(([,k])=>done(k));
    const fill = all ? '#3c9d58' : i===cur ? '#ffc83d' : '#ffffff';
    return `<svg class="leafdot" viewBox="0 0 40 40" aria-label="${s.name}${all?' 완료':''}"><path d="M20 3 C33 9 36 26 20 37 C4 26 7 9 20 3Z" fill="${fill}"/>${all?'<path d="M13 21 l5 5 l9 -11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`;
  }).join('');
}

/* ============ 화면 그리기 ============ */
function render(){
  if(st.cur<0) return renderStart();
  if(st.cur>=SCREENS.length) return renderFinal();
  const i=st.cur, sc=SCREENS[i], p=prog(i), sec=SECS[sc.sec], step=sc.steps[p], complete=!step;
  if(step && (step.kind==='fill'||step.kind==='pick')){ const k=i+'-'+step.ii; if(!ORDERS[k]) ORDERS[k]=shuffle(step.opts); order=ORDERS[k]; }

  // 말풍선
  let bub, cls='', mood='happy';
  if(msg){ bub=msg.text+(msg.hint?`<span class="hint">${msg.hint}</span>`:''); cls=msg.type; if(msg.type==='oops') mood='oops'; }
  else if(complete){ bub=sc.win; cls='good'; }
  else if(step.kind==='tap') bub='노란 카드를 모두 눌러 보세요!';
  else if(step.kind==='pick') bub='아래에서 맞는 것을 골라요!<span class="hint">학습지에 O표 한 것과 똑같이!</span>';
  else bub='빈칸에 들어갈 말을 아래에서 골라요!';
  if(complete && msg && msg.type==='good') { bub = msg.text+`<span class="hint">${sc.win}</span>`; }

  // 문장들
  const items = sc.items.map((it,ii)=>{
    const last = it.t==='fill' ? it.start + it.parts.filter(x=>typeof x==='object').length - 1 : it.start;
    const state = it.t==='info' ? (complete?'':'later') : (p>=it.start && p<=last && !complete ? 'now' : p<it.start ? 'later' : '');
    if(it.t==='info') return `<div class="item info ${state}">${it.text}</div>`;
    if(it.t==='fill'){
      let k=it.start;
      const html = it.parts.map(x=>{
        if(typeof x==='string') return x;
        const idx=k++;
        if(idx<p) return `<span class="blank done ${popKey===i+'-'+idx?'pop':''}">${x.a}</span>`;
        if(idx===p) return `<span class="blank now">?</span>`;
        return `<span class="blank">&nbsp;</span>`;
      }).join('');
      return `<div class="item ${state}"><p class="sent">${html}</p></div>`;
    }
    if(it.t==='pick'){
      const idx=it.start;
      const b = idx<p ? `<span class="blank done ${popKey===i+'-'+idx?'pop':''}">${it.a}</span>` : idx===p ? `<span class="blank now">?</span>` : `<span class="blank">&nbsp;</span>`;
      return `<div class="item ${state}"><div class="pick"><span>${it.q}</span>${b}</div></div>`;
    }
    if(it.t==='tap'){
      const finished = p>it.start;
      return `<div class="item ${state}"><p class="sent" style="margin-bottom:8px">이산화탄소는 언제 발생할까요?</p><div class="taps">${it.cards.map((c,ci)=>{
        const seen = finished || tapped.has(ci);
        return `<button class="tapc ${seen?'seen':''}" data-tap="${ci}" id="tap-${i}-${ci}">${icon(c[0])}<span>${c[1]}</span>${seen?'':'<span class="cover">?</span>'}</button>`;}).join('')}</div></div>`;
    }
  }).join('');

  // 아래 칸
  let dock;
  if(complete){
    dock = `<button class="next" id="next">${i===SCREENS.length-1?'결과 카드 보기 ★':'다음으로 ▶'}</button>`;
  } else if(step.kind==='tap'){
    dock = `<div class="dock-label">카드를 눌러서 확인해요 (${tapped.size} / 3)</div>`;
  } else {
    const remaining = order.filter(o=>!nope.has(o));
    const glow = miss>=2 || remaining.length===1;
    dock = `<div class="dock-label">${step.kind==='pick'?'맞는 것을 눌러요':'빈칸에 들어갈 말을 눌러요'}</div><div class="opts">${order.map((o,oi)=>
      `<button class="opt ${nope.has(o)?'nope':''} ${glow&&o===step.a?'glow':''}" data-opt="${oi}" id="opt-${i}-${p}-${oi}">${icon(o)}<span>${o}</span></button>`).join('')}</div>`;
  }

  app.innerHTML = `
  <header class="top">
    <button class="back" id="back" aria-label="이전 화면">◀</button>
    <div class="leaves">${leafDots()}</div>
    <div class="page">학습지 ${sec.page}쪽</div>
  </header>
  <main class="main"><div class="wrap">
    <div class="art">${sc.art(p)}</div>
    <div class="work">
      <div class="coach">${mascot(mood)}<div class="bubble ${cls}">${bub}</div></div>
      <div><div class="sec">${sec.name}</div><h2>${sc.title}</h2></div>
      <div class="items">${items}</div>
    </div>
  </div></main>
  <footer class="dock"><div class="dock-in">${dock}</div></footer>`;
  popKey='';

  document.getElementById('back').onclick=()=>go(st.cur-1);
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>go(st.cur+1);
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>choose(order[+b.dataset.opt], b));
  app.querySelectorAll('[data-tap]').forEach(b=>b.onclick=()=>{
    if(!step || step.kind!=='tap') return;
    tapped.add(+b.dataset.tap);
    if(tapped.size>=3 && !done(i)){ st.prog[i]=prog(i)+1; msg={type:'good',text:'모두 찾았어요!'}; save(); }
    render();
  });
}

function choose(o, btn){
  const i=st.cur, sc=SCREENS[i], p=prog(i), step=sc.steps[p];
  if(o===step.a){
    st.prog[i]=p+1; popKey=i+'-'+p; miss=0; nope=new Set();
    msg={type:'good', text:PRAISE[Math.floor(Math.random()*PRAISE.length)]};
    save(); render();
  } else {
    miss++; nope.add(o);
    const hint = miss>=2 ? '반짝이는 카드를 눌러 보세요!' : (step.h || `학습지 ${SECS[sc.sec].page}쪽을 보고 골라요`);
    msg={type:'oops', text:'다시 골라 볼까요?', hint};
    btn.classList.add('shake');
    setTimeout(render, 380);
  }
}

/* ============ 시작 화면 ============ */
function renderStart(){
  const started = Object.keys(st.prog).length>0;
  app.innerHTML = `<main class="main"><div class="start">
    <div class="hero">${mascot()}</div>
    <div>
      <div class="kicker">원예 · 과학 융합수업</div>
      <h1>새싹 박사의<br><em>광합성</em> 탐구</h1>
      <p>학습지를 다 채웠나요? 학습지를 보면서 빈칸을 하나씩 채워요.</p>
      <div class="namebox"><label for="nm">내 이름</label><input id="nm" autocomplete="off" maxlength="12" placeholder="이름을 써요" value="${(st.name||'').replace(/"/g,'&quot;')}"></div>
      <div class="plan">
        <div><b>실험 1</b>식물은 무엇을 먹을까? (검정말)</div>
        <div><b>실험 2</b>잎에서 만든 양분 찾기 (녹말)</div>
      </div>
      <div class="row">
        <button class="next" id="go">${started?'이어서 하기 ▶':'시작하기 ▶'}</button>
        ${started?`<button class="ghost ${resetArm?'warn':''}" id="reset">${resetArm?'한 번 더 누르면 지워져요':'처음부터 다시'}</button>`:''}
      </div>
    </div></div></main>`;
  const nm=document.getElementById('nm');
  nm.oninput=()=>{ st.name=nm.value.trim(); save(); };
  document.getElementById('go').onclick=()=>{
    st.name=nm.value.trim();
    let first=SCREENS.findIndex((s,k)=>!done(k)); if(first<0) first=SCREENS.length;
    go(started?first:0);
  };
  const r=document.getElementById('reset');
  if(r) r.onclick=()=>{ if(!resetArm){ resetArm=true; renderStart(); setTimeout(()=>{resetArm=false; if(st.cur<0) renderStart();},3000); return; }
    resetArm=false; st={name:'',cur:-1,prog:{},fav:null}; save(); renderStart(); };
}

/* ============ 결과 카드 ============ */
function renderFinal(){
  const d=new Date(); const date=`${d.getMonth()+1}월 ${d.getDate()}일`;
  const favs=[['파란색','BTB 색깔 바뀌기'],['검정말을 넣는다','검정말 실험'],['청람색','녹말 찾기 (청람색)']];
  app.innerHTML = `
  <header class="top">
    <button class="back" id="back" aria-label="이전 화면">◀</button>
    <div class="leaves">${leafDots()}</div>
    <div class="page">완성!</div>
  </header>
  <main class="main"><div class="final">
    <div class="stamp">광합성<br>박사<br>인증</div>
    <div class="final-head">${mascot()}<div><h1>나의 광합성 탐구 결과</h1><div class="who">${st.name||'꼬마 과학자'} · ${date}</div></div></div>
    <div class="res">
      <section><h3>실험 1 · 식물은 무엇을 먹을까?</h3>${ART.tubesResult(-1,1)}
        <ul><li>A 용액만 → 노란색 (광합성 안 함)</li><li>B 검정말 → 파란색 (광합성, 이산화탄소 사용)</li><li>C 검정말+호일 → 노란색 (빛이 없음)</li></ul></section>
      <section><h3>실험 2 · 잎에서 만든 양분 찾기</h3>${ART.twoLeaves()}
        <ul><li>① 햇볕 받은 잎 → 청람색 → 녹말 있음</li><li>② 포일 씌운 잎 → 변화 없음 → 녹말 없음</li></ul></section>
    </div>
    <div class="learn"><h3>알게 된 것</h3>
      <p>식물은 <mark>광합성</mark>을 통해 스스로 <mark>녹말</mark>(양분)을 만들어 낸다.</p>
      <p>광합성 과정에는 <mark>빛</mark>과 <mark>이산화탄소</mark>가 필요하다.</p></div>
    <div class="fav"><h3>가장 재미있었던 실험을 눌러요</h3><div class="chips">${favs.map((f,k)=>`<button class="chip ${st.fav===k?'on':''}" data-fav="${k}" id="fav-${k}">${icon(f[0])}${f[1]}</button>`).join('')}</div></div>
    <div class="shot"><b>다 했어요!</b> 이 화면을 태블릿으로 찍어서 패들렛에 올려요.</div>
  </div></main>`;
  document.getElementById('back').onclick=()=>go(SCREENS.length-1);
  app.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{ st.fav=+b.dataset.fav; save(); renderFinal(); });
}

if(st.cur>SCREENS.length) st.cur=-1;
render();
})();
</script>
</body></html>
